<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JavaScript Text-to-Speech</title>
  </head>
  <body>
    <textarea id="text" rows="4" cols="50">Your order number is 4 8 1 5 2.</textarea>
    <select id="voice"></select>
    <label>Rate <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" /></label>
    <label>Pitch <input id="pitch" type="range" min="0" max="2" step="0.1" value="1" /></label>
    <button id="speak">Speak</button>
    <button id="stop">Stop</button>
    <script src="script.js"></script>
  </body>
</html>
